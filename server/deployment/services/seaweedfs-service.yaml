apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: resiaiac
spec:
  clusterIP: None
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333

    - name: master
      port: 9333
      targetPort: 9333

    - name: filer
      port: 8888
      targetPort: 8888

    - name: volume
      port: 8080
      targetPort: 8080
