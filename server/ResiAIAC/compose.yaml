services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: resiaiac
      POSTGRES_USER: ${DB_USR}
      POSTGRES_PASSWORD: ${DB_PWD}
    ports:
      - "5432:5432"
    networks:
      - dev_net
    volumes:
      - pg_data:/var/lib/postgresql

  application:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/resiaiac
      DB_USR: ${DB_USR}
      DB_PWD: ${DB_PWD}
    ports:
      - "8080:8080"
    networks:
      - dev_net
    depends_on:
      - postgres

networks:
  dev_net:
    driver: bridge

volumes:
  pg_data: