services:

  redis:
    image: redis:8.8.0
    command: redis-server --requirepass password
    restart: always
    ports:
      - "6379:6379"
    networks:
      - dev_net

# -----------------------------------------------------------------------------------

  application:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://application-postgres:5432/resiaiac
      DB_USR: ${DB_USR}
      DB_PWD: ${DB_PWD}
    ports:
      - "8080:8080"
    networks:
      - dev_net
    depends_on:
      - application-postgres
      - keycloak

  application-postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: resiaiac
      POSTGRES_USER: ${DB_USR}
      POSTGRES_PASSWORD: ${DB_PWD}
    ports:
      - "5432:5432"
    networks:
      - dev_net
    volumes:
      - app_pg_data:/var/lib/postgresql

# -----------------------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8090:8090"
    networks:
      - dev_net
    command: start-dev --import-realm
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    environment:
      KC_HOSTNAME_STRICT: false
      KC_HTTP_PORT: 8090
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USR}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PWD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USR}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PWD}
    depends_on:
      - keycloak-postgres

  keycloak-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USR}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PWD}
      POSTGRES_DB: keycloak
    ports:
      - "5433:5432"
    networks:
      - dev_net
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data

networks:
  dev_net:
    driver: bridge

volumes:
  app_pg_data:
  keycloak_pg_data:
