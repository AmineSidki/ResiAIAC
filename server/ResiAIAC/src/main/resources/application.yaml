spring:
  application:
    name: ResiAIAC

  data:
    web:
      pageable:
        max-page-size: 20

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8090/realms/ResiAIAC/protocol/openid-connect/certs
#          issuer-uri: http://keycloak:8090/realms/ResiAIAC

  datasource:
    url: ${DB_URL}
    username: ${DB_USR}
    password: ${DB_PWD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

keycloak:
  admin:
    server-url: http://keycloak:8090
    realm: ResiAIAC
    client-id: resiaiac-admin-service
    secret: ${SPRING_KC_ADMIN_SECRET}