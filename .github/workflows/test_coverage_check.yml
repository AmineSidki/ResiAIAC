name: Test Coverage Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coverage-check:
    name: Verify tests and coverage
    runs-on: ubuntu-latest
    
    # This applies the working directory to all run steps in this job
    defaults:
      run:
        working-directory: server/ResiAIAC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests and verify coverage
        run: mvn -B verify
